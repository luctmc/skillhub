# SkillHub — Vocabulário controlado
#
# Esta é a única fonte de verdade para categorias, tags e status aceitos.
# `npm run validate` falha se qualquer skill usar um valor fora daqui.
# Para adicionar uma tag ou categoria nova, edite este arquivo NO MESMO PR
# da skill que a introduz. Veja docs/taxonomy.md para as regras de uso.

categories:
  - id: ai-agents
    label: AI Agents
    description: Construir e operar agentes — prompts, skills, MCP, sub-agentes, evals, orquestração.
  - id: automation
    label: Automation
    description: Executar trabalho repetitivo — scripts, scaffolding, migrações em lote, workflows.
  - id: design
    label: Design
    description: UI/UX, design systems, visual, motion, branding, protótipos.
  - id: development
    label: Development
    description: Escrever e refatorar código de aplicação — frameworks, linguagens, camada de dados.
  - id: devops
    label: DevOps
    description: CI/CD, infraestrutura, containers, cloud, observabilidade, release.
  - id: documentation
    label: Documentation
    description: Produzir documentação — READMEs, ADRs, API docs, explicação de codebase.
  - id: productivity
    label: Productivity
    description: Trabalho que não é código — planejamento, escrita, comunicação, gestão de tarefas.
  - id: quality
    label: Quality
    description: Julgar trabalho existente — code review, acessibilidade, performance, dívida técnica.
  - id: research
    label: Research
    description: Investigar e sintetizar — exploração de codebase, spikes, comparação de alternativas.
  - id: security
    label: Security
    description: AppSec, secrets, dependências, threat modeling, compliance.
  - id: testing
    label: Testing
    description: Produzir e rodar testes — unitário, e2e, browser testing, fixtures, cobertura.
  - id: version-control
    label: Version Control
    description: Git e GitHub — commits, branches, PRs, changelogs, releases.

# Tags agrupadas por faceta. O agrupamento é só para organização do índice;
# no front matter as tags ficam todas juntas em uma lista plana.
