# Sinônimos proibidos → tag correta a usar. O validador rejeita a chave
# e sugere o valor.
tag_synonyms:
  front-end: frontend
  front: frontend
  webfrontend: frontend
  back-end: backend
  a11y: accessibility
  a11y-testing: accessibility
  e2e-testing: e2e
  end-to-end: e2e
  unit-testing: testing
  ci-cd: deployment
  cicd: deployment
  doc: documentation
  docs: documentation
  git: version-control
  github: version-control

status:
  - id: trial
    description: Em avaliação. Use por conta e risco. Padrão de toda entrada nova.
  - id: approved
    description: Funciona, pode usar. Alguém já usou em projeto real.
  - id: recommended
    description: Comece por aqui para este tipo de trabalho.
  - id: deprecated
    description: Usávamos, não use mais. Exige campo superseded_by.
  - id: rejected
    description: Avaliada e descartada. Exige campo reason.

source:
  - anthropic
  - vendor
  - community
  - internal

agents:
  - claude-code
  - codex
  - cursor
  - gemini-cli
  - copilot
  - universal

# Renomeações de skill: nome antigo → nome novo.
# Preenchido conforme skills forem renomeadas, para não quebrar presets e links.
renames: {}
