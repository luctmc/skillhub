    - backend
    - web
    - mobile
    - desktop
    - api
    - database
    - data
    - ai
    - cloud
    - cli
  activity:
    - accessibility
    - animation
    - architecture
    - browser
    - changelog
    - codebase
    - code-review
    - debugging
    - deployment
    - dependencies
