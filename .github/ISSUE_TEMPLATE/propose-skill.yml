name: Propose a skill
description: Sugira uma skill (externa ou própria) sem precisar abrir PR
title: "[propose] "
labels: ["proposal"]
body:
  - type: input
    id: name
    attributes:
      label: Nome sugerido
      placeholder: browser-testing
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options:
        - Externa (catálogo)
        - Própria (precisamos escrever)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: O que ela faz / que problema resolve
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repositório (se for externa)
      placeholder: https://github.com/...
  - type: textarea
    id: use_when
    attributes:
      label: Quando usar
      description: 2-5 situações concretas
